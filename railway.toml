# railway.toml — tells Railway how to build and run the server
[build]
builder = "nixpacks"
buildCommand = "if [ -d server ]; then cd server && npm install; else echo 'OTJ worker - no build'; fi"

[deploy]
startCommand = "if [ -d server ]; then cd server && npm start; else /opt/venv/bin/python otj_prechecks_worker.py; fi"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "otj-colyseus"
