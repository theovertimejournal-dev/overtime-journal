name: OTJ Pre-Tip Checks (Game Hours)

on:
  schedule:
    # Every 5 minutes, 15:00-08:59 UTC = 8AM-1:59AM AZ.
    # Covers early tip-offs through late west-coast games. GitHub cron has no
    # hour ranges, so each hour is listed. Cron can run a few min late — that's
    # why the script watches a wide [tip-35, tip-5] window instead of exact marks.
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 15,16,17,18,19,20,21,22,23 * * *'
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 0,1,2,3,4,5,6,7,8 * * *'

  workflow_dispatch:

jobs:
  pre-tip-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 6

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install supabase requests python-dotenv

      - name: Run pre-tip checks
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TANK01_API_KEY:       ${{ secrets.TANK01_API_KEY }}
          OTJ_ALERT_WEBHOOK:    ${{ secrets.OTJ_ALERT_WEBHOOK }}
        run: |
          cd python
          python otj_prechecks.py
